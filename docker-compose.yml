services:
  gemini-tts-pronunciation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gemini-tts-pronunciation
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GOOGLE_CLOUD_PROJECT=${GOOGLE_CLOUD_PROJECT:-your-project-id}
      - GOOGLE_CLOUD_LOCATION=global
      - GCLOUD_CONFIG_NAME=${GCLOUD_CONFIG_NAME:-default}
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/keys/application_default_credentials.json
    volumes:
      - ${HOME}/.config/gcloud/application_default_credentials.json:/tmp/keys/application_default_credentials.json:ro
      - .:/app
    restart: unless-stopped
